<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume Helper Chatbot</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --bubble-user: #5b4fdb;
        --panel-bg: #f2f1ec;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      .chat-card {
        max-width: 700px;
        border: 1px solid #e3e2db;
        border-radius: 10px;
        overflow: hidden;
      }
      .chat-header {
        padding: 0.9rem 1.25rem;
        border-bottom: 1px solid #e3e2db;
        background: #fff;
      }
      .chat-header h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0;
        color: #2b2b2b;
      }
      .chat-history {
        height: 60vh;
        min-height: 320px;
        overflow-y: auto;
        background: var(--panel-bg);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .bubble {
        max-width: 75%;
        padding: 0.55rem 1rem;
        border-radius: 18px;
        font-size: 0.9rem;
        line-height: 1.4;
        word-wrap: break-word;
        white-space: pre-wrap;
      }
      .bubble.bot {
        align-self: flex-start;
        background: #ffffff;
        border: 1px solid #e3e2db;
        color: #2b2b2b;
        border-bottom-left-radius: 4px;
      }
      .bubble.user {
        align-self: flex-end;
        background: var(--bubble-user);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .bubble.error {
        align-self: flex-start;
        background: #fdecea;
        border: 1px solid #f3c2c2;
        color: #842029;
        border-bottom-left-radius: 4px;
      }
      .bubble .attachment {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.75rem;
        opacity: 0.8;
      }

      /* Typing indicator (borrowed from reference, adapted to pill bubbles) */
      .bubble.typing {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0.6rem 1rem;
      }
      .bubble.typing .dot {
        width: 6px;
        height: 6px;
        background: var(--bubble-user);
        border-radius: 50%;
        animation: bounce 1.2s infinite ease;
        opacity: 0.6;
      }
      .bubble.typing .dot:nth-child(2) { animation-delay: 0.2s; }
      .bubble.typing .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40%           { transform: scale(1);   opacity: 1;   }
      }

      .chat-input-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid #e3e2db;
        background: #fff;
      }
      .attach-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid #d8d7d0;
        color: #6b6a63;
        cursor: pointer;
        flex-shrink: 0;
        transition: opacity 0.15s, background 0.15s;
      }
      .attach-btn:hover {
        background: #f2f1ec;
      }
      .attach-btn.disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      .chat-text-input {
        border-radius: 999px;
        border: 1px solid #d8d7d0;
      }
      .chat-text-input:focus {
        box-shadow: none;
        border-color: var(--bubble-user);
      }
      .send-btn {
        background: var(--bubble-user);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 0.45rem 1.25rem;
        font-weight: 500;
        flex-shrink: 0;
      }
      .send-btn:hover {
        background: #4a3fc4;
        color: #fff;
      }
      .send-btn:disabled {
        opacity: 0.6;
      }
      .file-indicator {
        padding: 0 0.9rem 0.6rem;
        font-size: 0.78rem;
        color: #6b6a63;
        min-height: 1.2rem;
      }
      .file-indicator .remove-file {
        color: #c0392b;
        cursor: pointer;
        margin-left: 0.4rem;
        text-decoration: underline;
      }

      /* Toast (borrowed from reference) */
      #toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #e53e3e;
        color: #fff;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 0.85rem;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
        z-index: 999;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body class="bg-white">
    <div class="container py-4">
      <div class="chat-card mx-auto">
        <div class="chat-header">
          <h1>Resume Helper Chatbot</h1>
        </div>

        <div id="chat-history" class="chat-history"></div>

        <form id="chat-form" class="chat-input-bar">
          <label for="pdf-upload" id="attach-btn" class="attach-btn" title="Attach a PDF">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </label>
          <input
            type="file"
            id="pdf-upload"
            accept="application/pdf"
            class="d-none"
          />
          <input
            type="text"
            id="message-input"
            class="form-control chat-text-input"
            placeholder="Type a message..."
            autocomplete="off"
          />
          <button type="submit" class="btn send-btn">Send</button>
        </form>
        <div id="file-indicator" class="file-indicator"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      const MAX_PDF_SIZE = 10 * 1024 * 1024; // 10 MB

      const chatHistoryEl = document.getElementById("chat-history");
      const chatForm = document.getElementById("chat-form");
      const messageInput = document.getElementById("message-input");
      const pdfUploadInput = document.getElementById("pdf-upload");
      const attachBtn = document.getElementById("attach-btn");
      const fileIndicatorEl = document.getElementById("file-indicator");
      const sendBtn = chatForm.querySelector(".send-btn");
      const toast = document.getElementById("toast");

      let selectedFile = null;
      let busy = false; // prevents double-sends and mid-flight file changes

      // ── Toast helper ─────────────────────────────────────────
      function showToast(msg, duration = 4000) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), duration);
      }

      // ── Bubble rendering ─────────────────────────────────────
      function addBubble(text, sender, attachmentName) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${sender}`;
        bubble.textContent = text;

        if (attachmentName) {
          const attach = document.createElement("span");
          attach.className = "attachment";
          attach.textContent = `📎 ${attachmentName}`;
          bubble.appendChild(attach);
        }

        chatHistoryEl.appendChild(bubble);
        chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
        return bubble;
      }

      // ── Typing indicator ─────────────────────────────────────
      function showTyping() {
        const bubble = document.createElement("div");
        bubble.className = "bubble bot typing";
        bubble.id = "typing-indicator";
        bubble.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
        chatHistoryEl.appendChild(bubble);
        chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
      }
      function hideTyping() {
        document.getElementById("typing-indicator")?.remove();
      }

      // ── Busy / loading state ─────────────────────────────────
      function setLoading(state) {
        busy = state;
        sendBtn.disabled = state;
        messageInput.disabled = state;
        pdfUploadInput.disabled = state;
        attachBtn.classList.toggle("disabled", state);
      }

      // ── File selection ───────────────────────────────────────
      pdfUploadInput.addEventListener("change", () => {
        const file = pdfUploadInput.files[0];
        if (!file) return;

        if (file.type !== "application/pdf") {
          showToast("Please upload a valid PDF file.");
          pdfUploadInput.value = "";
          selectedFile = null;
          renderFileIndicator();
          return;
        }

        if (file.size > MAX_PDF_SIZE) {
          showToast("PDF must be under 10 MB.");
          pdfUploadInput.value = "";
          selectedFile = null;
          renderFileIndicator();
          return;
        }

        selectedFile = file;
        renderFileIndicator();
      });

      function renderFileIndicator() {
        fileIndicatorEl.textContent = "";
        if (!selectedFile) return;

        fileIndicatorEl.append(`Attached: ${selectedFile.name}`);
        const removeLink = document.createElement("span");
        removeLink.className = "remove-file";
        removeLink.textContent = "remove";
        removeLink.addEventListener("click", () => {
          if (busy) return;
          selectedFile = null;
          pdfUploadInput.value = "";
          renderFileIndicator();
        });
        fileIndicatorEl.appendChild(removeLink);
      }

      // ── Submit ───────────────────────────────────────────────
      // The actual JSON-over-the-wire call to the backend happens server-side
      // in app.py (/send) -- it converts any attached PDF to text and then
      // POSTs {"message": ..., "pdf_text": ...} to BACKEND_URL.
      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (busy) return;

        const message = messageInput.value.trim();
        if (!message && !selectedFile) {
          showToast("Type a message or attach a PDF first.");
          return;
        }

        setLoading(true);

        addBubble(
          message || "(sent a PDF with no message)",
          "user",
          selectedFile ? selectedFile.name : null
        );
        showTyping();

        const formData = new FormData();
        formData.append("message", message);
        if (selectedFile) {
          formData.append("pdf", selectedFile);
        }

        messageInput.value = "";
        selectedFile = null;
        pdfUploadInput.value = "";
        renderFileIndicator();

        try {
          const res = await fetch("/send", {
            method: "POST",
            body: formData,
          });
          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || `Request failed (${res.status})`);
          }

          hideTyping();
          addBubble(data.reply || "(empty response from backend)", "bot");
        } catch (err) {
          console.error(err);
          hideTyping();
          addBubble(err.message || "Something went wrong.", "error");
        } finally {
          setLoading(false);
          messageInput.focus();
        }
      });

      addBubble("Hi! How can I help you today?", "bot");
    </script>
  </body>
</html>
